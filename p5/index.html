<!doctype html>
<html lang="zh-Hant">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f8fafd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lucky Draw</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-state="PACK_SELECT">
<main class="app" id="app">
  <header class="top-actions" id="topActions">
    <button class="pack-chip" id="packBtn" aria-label="更換題組">P3</button>
    <button class="icon-btn" id="soundBtn" aria-label="關閉音效"></button>
  </header>

  <section class="home" id="homeScreen">
    <button class="draw-orb" id="drawBtn" aria-label="抽題">
      <span class="draw-orb__label">抽題</span>
    </button>
  </section>

  <section class="draw-stage" id="drawStage" aria-hidden="true">
    <div class="scene" id="scene"></div>
  </section>

  <div class="reveal-bridge" id="revealBridge" aria-hidden="true"></div>
</main>

<section class="pack-picker show" id="packPicker" aria-hidden="false">
  <div class="pack-grid" role="dialog" aria-modal="true" aria-label="選擇題組">
    <button class="pack-option p3" data-pack="P3">P3</button>
    <button class="pack-option p4" data-pack="P4">P4</button>
    <button class="pack-option p5" data-pack="P5">P5</button>
    <button class="pack-option p6" data-pack="P6">P6</button>
  </div>
</section>

<section class="question" id="result" aria-hidden="true">
  <header class="question-bar">
    <button class="pack-chip question-pack" id="resultPackBtn" aria-label="更換題組">P3</button>
    <div class="question-id" id="winner">Q1</div>
  </header>
  <div class="question-body">
    <div class="question-frame" id="questionFrame" data-fit="standard">
      <img id="resultImg" alt="抽出的題目">
    </div>
  </div>
  <footer class="question-footer">
    <button class="next-btn" id="nextBtn">再抽一題</button>
  </footer>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
