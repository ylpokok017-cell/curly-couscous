<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#5b3df5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>幸運抽題樂園</title>
<style>
:root{
  --ink:#261454;--white:#fff;--yellow:#ffd84d;--pink:#ff6fae;--cyan:#45d7ff;--green:#7be35e;--purple:#6b4cff;
  --shadow:0 24px 70px rgba(54,24,128,.28);
  font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#6b4cff;color:#fff;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{font:inherit}
.app{position:relative;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:
radial-gradient(circle at 50% -5%,rgba(255,255,255,.92),transparent 21%),
radial-gradient(circle at 12% 22%,rgba(255,255,255,.18),transparent 25%),
radial-gradient(circle at 90% 18%,rgba(255,255,255,.2),transparent 24%),
linear-gradient(180deg,#72e1ff 0%,#75caff 26%,#807dff 65%,#724cff 100%)}
.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;opacity:.75;animation:twinkle 2.8s ease-in-out infinite}.spark:nth-child(1){left:7%;top:15%;font-size:22px}.spark:nth-child(2){right:9%;top:18%;font-size:28px;animation-delay:.7s}.spark:nth-child(3){left:17%;bottom:24%;font-size:18px;animation-delay:1.2s}.spark:nth-child(4){right:18%;bottom:28%;font-size:22px;animation-delay:1.8s}.spark:nth-child(5){left:47%;top:12%;font-size:18px;animation-delay:.4s}@keyframes twinkle{50%{transform:scale(1.35) rotate(12deg);opacity:1}}
.cloud{position:absolute;width:160px;height:56px;border-radius:999px;background:rgba(255,255,255,.15);filter:blur(.2px)}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:72px;height:72px;left:26px;top:-25px}.cloud:after{width:88px;height:88px;right:20px;top:-36px}.c1{left:-30px;top:31%;transform:scale(.8)}.c2{right:-45px;top:37%;transform:scale(1.05)}
.topbar{position:absolute;z-index:20;top:max(18px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));right:max(20px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(#fff,#fff2ca);font-size:32px;box-shadow:var(--shadow);transform:rotate(-7deg)}.brand strong{display:block;font-size:25px;line-height:1}.brand span{display:block;font-size:13px;font-weight:800;margin-top:5px;opacity:.95}.toolbar{display:flex;gap:10px}.icon-btn{height:54px;min-width:54px;border:0;border-radius:18px;padding:0 14px;background:linear-gradient(#fff,rgba(255,255,255,.82));color:#5336bd;font-size:22px;font-weight:950;box-shadow:var(--shadow);cursor:pointer}.icon-btn:active{transform:scale(.96)}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:94px 24px 112px}.hero{text-align:center;margin-bottom:12px}.tag{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.28);font-size:13px;font-weight:950}.hero h1{margin:12px 0 4px;font-size:clamp(38px,5vw,66px);line-height:.95;letter-spacing:-.04em;text-shadow:0 7px 0 rgba(63,34,159,.14),0 14px 34px rgba(53,25,132,.22)}.hero p{margin:0;font-size:clamp(16px,2vw,21px);font-weight:900}
.arcade{position:relative;width:min(980px,95vw);height:min(520px,56vh);min-height:420px;border-radius:42px;padding:22px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.14)),linear-gradient(180deg,#8e7dff,#6448ed);border:4px solid rgba(255,255,255,.48);box-shadow:0 30px 90px rgba(47,20,117,.33),inset 0 2px rgba(255,255,255,.6);overflow:hidden}.arcade:before{content:"";position:absolute;inset:14px;border:3px dashed rgba(255,255,255,.2);border-radius:30px;pointer-events:none}.arcade-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:4px 10px 10px}.scene-badge,.status-badge{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.92);color:#5737c5;font-weight:1000;box-shadow:0 10px 24px rgba(42,18,103,.18)}.scene-badge{font-size:18px}.status-badge{font-size:16px}
.scene-shell{position:relative;z-index:2;height:340px;border-radius:34px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.09));border:3px solid rgba(255,255,255,.28);box-shadow:inset 0 2px rgba(255,255,255,.25),0 14px 28px rgba(35,14,90,.17)}.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.scene .floor{position:absolute;left:8%;right:8%;bottom:18px;height:18px;border-radius:50%;background:rgba(47,24,118,.14);filter:blur(4px)}
.controls{position:relative;z-index:3;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:12px}.main-btn{min-width:244px;height:70px;border:0;border-radius:26px;background:linear-gradient(#ffe97e,#ffc235);color:#4c2900;font-size:26px;font-weight:1000;box-shadow:0 16px 32px rgba(255,183,45,.27),inset 0 3px rgba(255,255,255,.68);cursor:pointer}.main-btn:active{transform:translateY(2px) scale(.985)}.main-btn:disabled{opacity:.75}.secondary{height:58px;min-width:76px;border:0;border-radius:21px;background:linear-gradient(#fff,rgba(255,255,255,.83));color:#5539c8;font-weight:950;font-size:18px;padding:0 18px;box-shadow:0 13px 26px rgba(43,18,104,.16);cursor:pointer}
.modebar{position:absolute;z-index:15;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:16px;width:min(920px,calc(100vw - 28px));padding:12px 16px;border-radius:24px;background:rgba(83,54,206,.34);border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(16px);font-weight:900}.toggle{display:flex;align-items:center;gap:9px;cursor:pointer}.toggle input{display:none}.switch{width:46px;height:28px;padding:4px;border-radius:999px;background:rgba(255,255,255,.33);box-shadow:inset 0 1px 5px rgba(0,0,0,.14)}.switch:after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:.23s}.toggle input:checked+.switch{background:#8ae46a}.toggle input:checked+.switch:after{transform:translateX(18px)}.history{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Question pack picker */
.pack-picker{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(65,194,255,.82),rgba(84,55,205,.88));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;visibility:hidden;pointer-events:none;transition:.25s ease}.pack-picker.show{opacity:1;visibility:visible;pointer-events:auto}.pack-panel{position:relative;width:min(960px,94vw);padding:clamp(24px,4vw,42px);border-radius:38px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,241,255,.94));border:4px solid rgba(255,255,255,.75);box-shadow:0 34px 100px rgba(38,15,98,.38);color:#3d279a;text-align:center}.pack-kicker{display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;background:#efe9ff;color:#6946da;font-size:14px;font-weight:1000}.pack-panel h2{margin:14px 0 6px;font-size:clamp(34px,5vw,58px);line-height:1;letter-spacing:-.04em}.pack-panel p{margin:0 0 24px;color:#6f61a7;font-size:clamp(15px,2vw,20px);font-weight:900}.pack-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.pack-option{position:relative;min-height:190px;border:0;border-radius:30px;padding:18px 12px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;box-shadow:0 18px 34px rgba(43,21,112,.18),inset 0 3px rgba(255,255,255,.35);transition:transform .16s ease,filter .16s ease}.pack-option:active{transform:scale(.97)}.pack-option:nth-child(1){background:linear-gradient(150deg,#ff6f99,#ff9b63)}.pack-option:nth-child(2){background:linear-gradient(150deg,#27c7f4,#5978ff)}.pack-option:nth-child(3){background:linear-gradient(150deg,#7bd950,#20b99b)}.pack-option:nth-child(4){background:linear-gradient(150deg,#a564ff,#7041e8)}.pack-option .pack-icon{font-size:42px;filter:drop-shadow(0 7px 12px rgba(0,0,0,.14))}.pack-option strong{font-size:clamp(38px,5vw,58px);line-height:1}.pack-option span{font-size:15px;font-weight:950;opacity:.96}.pack-dots{display:flex;gap:6px;margin-top:2px}.pack-dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 5px rgba(0,0,0,.12)}.pack-cancel{margin-top:18px;height:48px;padding:0 20px;border:0;border-radius:17px;background:#ede7ff;color:#5e42ca;font-weight:1000;font-size:16px;cursor:pointer}.pack-cancel[hidden]{display:none}.pack-chip{height:34px;border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:0 12px;background:rgba(255,255,255,.9);color:#5639c8;font-weight:1000;font-size:13px;cursor:pointer;white-space:nowrap}.pack-chip:disabled{opacity:.65}.pack-now{color:#fff7a8;font-weight:1000}.modebar{flex-wrap:nowrap}
@media(max-width:760px){.pack-grid{grid-template-columns:repeat(2,1fr)}.pack-option{min-height:150px}.pack-panel{padding:22px 18px;border-radius:30px}.pack-option strong{font-size:42px}.pack-option .pack-icon{font-size:34px}}
@media(orientation:landscape) and (max-height:760px){.pack-panel{padding:18px 24px}.pack-panel h2{font-size:38px;margin:8px 0 4px}.pack-panel p{margin-bottom:14px;font-size:15px}.pack-option{min-height:128px;border-radius:24px;padding:10px}.pack-option .pack-icon{font-size:30px}.pack-option strong{font-size:38px}.pack-option span{font-size:13px}.pack-cancel{margin-top:10px;height:42px}}

/* shared scene elements */
.label-ball{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:1000;font-size:28px;box-shadow:0 10px 22px rgba(35,17,88,.2),inset 0 2px rgba(255,255,255,.35)}.q1{background:linear-gradient(#ff879e,#ff4c70)}.q2{background:linear-gradient(#54dbff,#12aaff)}.q3{background:linear-gradient(#8ce96d,#35bb45)}
/* 1 CARDS */
.cards-scene{gap:22px}.big-card{width:150px;height:205px;border-radius:28px;background:linear-gradient(#fff,#fff4c8);border:4px solid rgba(255,255,255,.55);box-shadow:0 20px 36px rgba(39,19,96,.23);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.big-card:nth-child(1){transform:rotate(-10deg) translateY(12px)}.big-card:nth-child(2){transform:translateY(-8px)}.big-card:nth-child(3){transform:rotate(10deg) translateY(12px)}.run .big-card{animation:cardShuffle .32s ease-in-out infinite}.run .big-card:nth-child(2){animation-delay:.08s}.run .big-card:nth-child(3){animation-delay:.16s}@keyframes cardShuffle{50%{transform:translateY(-28px) rotate(6deg) scale(1.08)}}
/* 2 WHEEL */
.wheel-wrap{position:relative;width:290px;height:290px;filter:drop-shadow(0 18px 28px rgba(41,18,100,.22))}.wheel{position:absolute;inset:12px;border-radius:50%;background:conic-gradient(from 0deg,#ff638c 0 120deg,#35caff 120deg 240deg,#69d84f 240deg 360deg);border:11px solid #fff0a0;box-shadow:inset 0 0 0 7px rgba(255,255,255,.42),0 0 0 5px rgba(92,56,201,.22);transform:rotate(0deg);will-change:transform}.wheel:before{content:"";position:absolute;inset:48%;border-radius:50%;background:#fff5a5;box-shadow:0 0 0 8px #694bd4,0 6px 14px rgba(44,18,106,.25);z-index:3}.wheel-label{position:absolute;left:50%;top:50%;width:70px;height:46px;margin:-23px 0 0 -35px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:25px;font-weight:1000;text-shadow:0 3px 8px rgba(0,0,0,.2);background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.5);box-shadow:0 7px 16px rgba(35,15,88,.14)}.wheel-label.wq1{transform:rotate(60deg) translateY(-86px) rotate(-60deg)}.wheel-label.wq2{transform:rotate(180deg) translateY(-86px) rotate(-180deg)}.wheel-label.wq3{transform:rotate(300deg) translateY(-86px) rotate(-300deg)}.wheel-pointer{position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:52px;height:58px;background:linear-gradient(#fff8b2,#ffc83d);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 7px 7px rgba(56,25,115,.3));z-index:5}.wheel-pointer:before{content:"";position:absolute;left:17px;top:9px;width:18px;height:18px;border-radius:50%;background:#fff}.run .wheel-wrap:not(.targeted) .wheel{animation:spinWheel .42s linear infinite}@keyframes spinWheel{to{transform:rotate(360deg)}}
/* 3 GACHA */
.gacha{position:relative;width:270px;height:270px}.gacha-top{position:absolute;left:42px;top:4px;width:186px;height:150px;border-radius:95px 95px 52px 52px;background:rgba(255,255,255,.72);border:8px solid #ffe477;overflow:hidden;box-shadow:0 14px 28px rgba(44,20,103,.2)}.capsule{position:absolute;width:54px;height:34px;border-radius:999px;border:3px solid rgba(255,255,255,.65);box-shadow:0 6px 10px rgba(40,20,86,.14)}.cap1{left:20px;top:68px;background:#ff78a4;transform:rotate(18deg)}.cap2{left:72px;top:35px;background:#58d8ff;transform:rotate(-12deg)}.cap3{left:112px;top:83px;background:#7be45f;transform:rotate(10deg)}.gacha-base{position:absolute;left:28px;right:28px;bottom:4px;height:135px;border-radius:34px;background:linear-gradient(#ff9dc2,#ff6d9f);border:7px solid #fff1a3;box-shadow:0 16px 28px rgba(42,18,100,.22)}.gacha-window{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;background:#fff;border:6px solid #6a4fff;display:grid;place-items:center;font-size:30px}.gacha-slot{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:90px;height:26px;border-radius:999px;background:#4a2da4}.run .capsule{animation:gachaBounce .25s ease-in-out infinite}.run .cap2{animation-delay:.08s}.run .cap3{animation-delay:.16s}.run .gacha-window{animation:gachaKnob .35s linear infinite}@keyframes gachaBounce{50%{transform:translateY(-18px) rotate(28deg)}}@keyframes gachaKnob{to{transform:translateX(-50%) rotate(360deg)}}
/* 4 TREASURE */
.chest{position:relative;width:280px;height:190px;margin-top:35px}.chest-lid{position:absolute;left:10px;right:10px;top:0;height:88px;border-radius:45px 45px 18px 18px;background:linear-gradient(#ffbc45,#f18a20);border:8px solid #ffd95b;transform-origin:50% 100%;box-shadow:0 8px 18px rgba(91,45,0,.2)}.chest-body{position:absolute;left:0;right:0;bottom:0;height:120px;border-radius:18px 18px 34px 34px;background:linear-gradient(#d96926,#a84420);border:8px solid #ffd95b;box-shadow:0 18px 30px rgba(47,20,105,.2)}.lock{position:absolute;left:50%;top:76px;transform:translateX(-50%);width:58px;height:64px;border-radius:12px;background:#ffe26a;border:6px solid #f7b62b;z-index:3}.treasure-glow{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:200px;height:120px;background:radial-gradient(circle,#fff8a8 0,rgba(255,232,90,.7) 30%,transparent 70%);opacity:0}.run .chest-lid{animation:openLid .65s ease-in-out infinite}.run .treasure-glow{animation:glowPulse .65s ease-in-out infinite}@keyframes openLid{50%{transform:rotateX(-70deg) translateY(-14px)}}@keyframes glowPulse{50%{opacity:1;transform:translateX(-50%) scale(1.25)}}
/* 5 SLOT */
.slot-machine{width:360px;height:230px;border-radius:34px;background:linear-gradient(#ff7fc0,#d84bf0);border:8px solid #fff0a4;box-shadow:0 18px 34px rgba(47,20,112,.24);padding:34px 26px;display:flex;gap:12px}.reel{flex:1;border-radius:18px;background:#fff;display:grid;place-items:center;color:#5736c3;font-size:36px;font-weight:1000;box-shadow:inset 0 0 0 5px rgba(109,75,255,.12)}.run .reel{animation:reelJump .2s ease-in-out infinite}.run .reel:nth-child(2){animation-delay:.06s}.run .reel:nth-child(3){animation-delay:.12s}@keyframes reelJump{50%{transform:translateY(16px);filter:blur(1px)}}
/* 6 ROCKET */
.rocket-scene{flex-direction:column}.rocket{position:relative;width:110px;height:190px;border-radius:58px 58px 28px 28px;background:linear-gradient(#fff,#dff4ff);border:7px solid #5e49d8;box-shadow:0 16px 30px rgba(40,18,100,.22)}.rocket:before{content:"";position:absolute;left:50%;top:54px;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;background:#54d7ff;border:6px solid #6c4be5}.rocket:after{content:"";position:absolute;left:18px;right:18px;bottom:-52px;height:70px;background:linear-gradient(#ffe96f,#ff8d3d,#ff4f7c);clip-path:polygon(20% 0,40% 100%,50% 48%,62% 100%,80% 0);filter:drop-shadow(0 8px 12px rgba(255,112,50,.25))}.rocket-q{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);font-size:22px;font-weight:1000;color:#5b3acb}.run .rocket{animation:rocketFly .48s ease-in-out infinite}@keyframes rocketFly{50%{transform:translateY(-54px) rotate(3deg)}}
/* 7 PORTAL */
.portal{position:relative;width:270px;height:270px;border-radius:50%;border:16px solid rgba(255,255,255,.75);box-shadow:0 0 0 12px rgba(95,64,245,.35),0 0 48px rgba(69,215,255,.55);background:radial-gradient(circle,#231059 0 28%,#4921a9 36%,#5ce1ff 58%,#fff 70%,transparent 72%)}.portal:before,.portal:after{content:"";position:absolute;border-radius:50%;inset:28px;border:6px dashed rgba(255,255,255,.78)}.portal:after{inset:54px;border-style:solid;border-color:rgba(255,234,100,.8)}.run .portal{animation:portalSpin 1s linear infinite}.run .portal:before{animation:portalSpin .6s linear reverse infinite}.run .portal:after{animation:portalSpin .42s linear infinite}@keyframes portalSpin{to{transform:rotate(360deg)}}
/* 8 BALLOONS */
.balloon-wrap{position:relative;width:500px;height:280px}.balloon{position:absolute;width:110px;height:140px;border-radius:55% 55% 50% 50%;display:grid;place-items:center;color:#fff;font-size:28px;font-weight:1000;box-shadow:0 15px 28px rgba(43,19,104,.2)}.balloon:after{content:"";position:absolute;width:3px;height:100px;background:rgba(255,255,255,.7);top:132px}.bl1{left:40px;top:70px;background:linear-gradient(#ff8cab,#ff4f79)}.bl2{left:195px;top:28px;background:linear-gradient(#62e1ff,#1db2ff)}.bl3{right:40px;top:70px;background:linear-gradient(#9aee75,#45bf45)}.run .balloon{animation:balloonDance .55s ease-in-out infinite}.run .bl2{animation-delay:.12s}.run .bl3{animation-delay:.24s}@keyframes balloonDance{50%{transform:translateY(-38px) rotate(6deg)}}
/* 9 GIFTS */
.gifts{display:flex;gap:28px;align-items:flex-end}.gift{position:relative;width:130px;height:130px;border-radius:18px;background:#ff759f;border:6px solid #fff0a0;box-shadow:0 16px 28px rgba(44,19,104,.2)}.gift:nth-child(2){background:#45ccff;transform:scale(1.08)}.gift:nth-child(3){background:#74da54}.gift:before{content:"";position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:78px;height:42px;border-radius:50% 50% 20% 20%;border:12px solid #ffe274}.gift:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:18px;transform:translateX(-50%);background:#ffe274}.gift span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:1000;z-index:2}.run .gift{animation:giftPop .38s ease-in-out infinite}.run .gift:nth-child(2){animation-delay:.08s}.run .gift:nth-child(3){animation-delay:.16s}@keyframes giftPop{50%{transform:translateY(-28px) rotate(-5deg) scale(1.07)}}
/* 10 DICE */
.dice-wrap{display:flex;gap:32px}.die{width:145px;height:145px;border-radius:30px;background:linear-gradient(#fff,#eef7ff);border:7px solid #ffde67;box-shadow:0 18px 30px rgba(44,19,104,.2);display:grid;place-items:center;color:#5a3ac7;font-size:34px;font-weight:1000}.run .die{animation:diceRoll .42s ease-in-out infinite}.run .die:nth-child(2){animation-delay:.12s}.run .die:nth-child(3){animation-delay:.24s}@keyframes diceRoll{50%{transform:translateY(-30px) rotate(18deg) scale(1.08)}}
/* 11 PLANETS */
.orbit-system{position:relative;width:330px;height:260px}.sun{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8b0,#ffd64a 55%,#ff9b38);box-shadow:0 0 38px rgba(255,217,82,.7)}.orbit-line{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.4);border-radius:50%}.ol1{width:180px;height:120px}.ol2{width:270px;height:190px}.planet{position:absolute;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:1000;font-size:21px;box-shadow:0 12px 22px rgba(37,17,90,.18)}.p1{left:18px;top:95px;background:#ff6589}.p2{right:22px;top:34px;background:#35c8ff}.p3{right:62px;bottom:6px;background:#67d94c}.run .orbit-system{animation:systemSpin 1.4s linear infinite}.run .sun{animation:sunPulse .45s ease-in-out infinite}@keyframes systemSpin{to{transform:rotate(360deg)}}@keyframes sunPulse{50%{filter:brightness(1.22);transform:translate(-50%,-50%) scale(1.1)}}
/* 12 MAGIC HATS */

function profileFor(id){return sceneProfiles[id]||{duration:3200,tick:150,base:500}}


function renderScene(s){currentScene=s.id;sceneEl.className='scene';sceneBadge.textContent=s.name;statusBadge.textContent='READY!';sceneEngine.mount(s)}
async function startScene(sceneDef,q,duration){
  statusBadge.textContent='GO!';let n=0;clearInterval(ticker);const ap=profileFor(sceneDef.id);
  ticker=setInterval(()=>{const rise=(n%5)*72;beep(ap.base+rise,.045,n%2?'square':'triangle',.020);n++},ap.tick);
  try{await sceneEngine.start(sceneDef,q,duration)}finally{clearInterval(ticker);ticker=null}
}
function stopScene(){clearInterval(ticker);ticker=null;sceneEngine.finish()}
async function countdown(quick=false){countOverlay.classList.add('show');const step=quick?280:500,go=quick?160:260;for(const v of ['3','2','1']){count.textContent=v;count.style.animation='none';void count.offsetWidth;count.style.animation='';beep(v==='1'?760:560,.12,'triangle',.06);await sleep(step)}count.textContent='GO!';beep(920,.13,'square',.07);await sleep(go);countOverlay.classList.remove('show')}
function resultOpen(q){
  resultImg.src=q.src;
  winner.textContent=`🏆 ${activePack||''} ${q.id} 抽中囉！`.replace('  ',' ');
  result.classList.add('show');
  result.setAttribute('aria-hidden','false');
  try{fanfare()}catch(e){console.warn('fanfare error',e)}
  try{confetti()}catch(e){console.warn('confetti error',e)}
}
function resultClose(){result.classList.remove('show');result.setAttribute('aria-hidden','true')}
async function draw(quick=false){
  if(!activePack){showPackPicker();return}
  if(busy)return;
  busy=true;resultClose();drawBtn.disabled=quickBtn.disabled=true;packBtn.disabled=true;
  try{
    const s=chooseScene(),qi=chooseQuestion(),q=questions[qi],prof=profileFor(s.id),duration=quick?Math.max(1650,Math.round(prof.duration*.58)):prof.duration+rnd(220);
    renderScene(s);await sleep(60);await countdown(quick);
    await startScene(s,q,duration);
    statusBadge.textContent=q.id;history.push(q.id);historyEl.textContent=`${activePack} · 已抽：`+history.join(' · ');sceneBadge.textContent=`✨ ${q.id} 出現了！`;
    try{beep(980,.12,'triangle',.08)}catch(e){}
    await sleep(quick?380:760);resultOpen(q);
  }catch(e){
    console.error('draw error',e);try{sceneEngine.stop(true)}catch(_){};clearInterval(ticker);ticker=null;toastMsg('動畫發生錯誤，已自動重置');
  }finally{busy=false;drawBtn.disabled=false;quickBtn.disabled=false;packBtn.disabled=false;countOverlay.classList.remove('show')}
}
function reset(){busy=false;drawBtn.disabled=false;quickBtn.disabled=false;clearInterval(ticker);ticker=null;sceneEngine.stop(false);remaining=[0,1,2];history=[];historyEl.textContent=activePack?`${activePack} · 尚未抽題`:'尚未抽題';renderScene(scenes[0]);toastMsg('已重設');try{beep(480,.1)}catch(e){}}
async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){toastMsg('請使用瀏覽器全螢幕')}}
drawBtn.onclick=()=>draw(false);quickBtn.onclick=()=>draw(true);resetBtn.onclick=reset;closeResult.onclick=homeBtn.onclick=resultClose;nextBtn.onclick=async()=>{resultClose();busy=false;drawBtn.disabled=false;quickBtn.disabled=false;await sleep(120);await draw(false)};fullscreenBtn.onclick=resultFullscreen.onclick=fullscreen;soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';toastMsg(soundOn?'音效開啟':'音效關閉')};noRepeat.onchange=()=>{remaining=[0,1,2];toastMsg(noRepeat.checked?'本輪不重複：開':'完全隨機：開')};packBtn.onclick=showPackPicker;packCancel.onclick=hidePackPicker;packOptions.forEach(btn=>btn.onclick=()=>selectPack(btn.dataset.pack));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&packPicker.classList.contains('show')&&activePack){hidePackPicker();return}if(packPicker.classList.contains('show'))return;if(e.key===' '||e.key==='Enter'){e.preventDefault();result.classList.contains('show')?resultClose():draw(false)}if(e.key==='Escape')resultClose()});
drawBtn.disabled=true;quickBtn.disabled=true;resetBtn.disabled=true;renderScene(scenes[0]);
const canvas=document.getElementById('confetti'),ctx=canvas.getContext('2d');let bits=[],raf=0;function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);function confetti(){const pal=['#ffd84d','#ff6fae','#45d7ff','#7be35e','#fff','#9b82ff'];bits=Array.from({length:180},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.18,vx:(Math.random()-.5)*14,vy:-6-Math.random()*10,g:.22+Math.random()*.12,r:4+Math.random()*7,c:pal[rnd(pal.length)],rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,life:150+rnd(50)}));cancelAnimationFrame(raf);anim()}function anim(){ctx.clearRect(0,0,innerWidth,innerHeight);bits.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.993;p.rot+=p.vr;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r*.55,p.r*2,p.r*1.1);ctx.restore()});bits=bits.filter(p=>p.life>0&&p.y<innerHeight+40);if(bits.length)raf=requestAnimationFrame(anim)}
})();
